<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Sidebar Fragment -->
    <aside th:fragment="sidebar(activeTab)" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col flex-shrink-0 min-h-screen text-slate-300">
        <!-- Brand Header -->
        <div class="h-16 px-6 flex items-center gap-3 border-b border-slate-800/80 bg-slate-950/40">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white font-bold shadow-md shadow-sky-500/20">
                CP
            </div>
            <div>
                <div class="font-bold text-white text-sm tracking-tight">ClientPortal</div>
                <div class="text-[10px] text-sky-400 font-mono">JV-CRM-005 &bull; Enterprise</div>
            </div>
        </div>

        <!-- Navigation Menu -->
        <div class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
            <div class="px-3 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Core Modules</div>

            <!-- Admin Navigation (Only for ROLE_ADMIN) -->
            <div sec:authorize="hasRole('ADMIN')" class="space-y-1">
                <a th:href="@{/admin/dashboard}"
                   th:classappend="${activeTab == 'admin_dashboard'} ? 'bg-sky-500/10 text-sky-400 border-sky-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border-transparent'"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium border transition group">
                    <svg class="w-5 h-5 transition-colors" th:classappend="${activeTab == 'admin_dashboard'} ? 'text-sky-400' : 'text-slate-500 group-hover:text-slate-300'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span>Admin Dashboard</span>
                </a>

                <a th:href="@{/admin/projects/new}"
                   th:classappend="${activeTab == 'new_project'} ? 'bg-sky-500/10 text-sky-400 border-sky-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border-transparent'"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium border transition group">
                    <svg class="w-5 h-5 transition-colors" th:classappend="${activeTab == 'new_project'} ? 'text-sky-400' : 'text-slate-500 group-hover:text-slate-300'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Create New Project</span>
                </a>
            </div>

            <!-- Client Navigation (Only for ROLE_CLIENT) -->
            <div sec:authorize="hasRole('CLIENT')" class="space-y-1">
                <a th:href="@{/clients/dashboard}"
                   th:classappend="${activeTab == 'client_dashboard'} ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border-transparent'"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium border transition group">
                    <svg class="w-5 h-5 transition-colors" th:classappend="${activeTab == 'client_dashboard'} ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span>Client Workspace</span>
                </a>
            </div>

            <div class="pt-6 px-3 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Pipeline Target</div>
            <div class="p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-xs">
                <div class="flex justify-between text-slate-400 mb-1">
                    <span>Benchmark Target</span>
                    <span class="font-mono text-emerald-400 font-semibold">$45,892</span>
                </div>
                <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-gradient-to-r from-sky-400 to-emerald-400 h-full w-[100%]"></div>
                </div>
                <div class="mt-2 text-[10px] text-slate-500">Enterprise Pipeline Standard</div>
            </div>
        </div>

        <!-- User Profile & Logout Box -->
        <div class="p-4 border-t border-slate-800 bg-slate-950/50">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 font-semibold text-xs">
                    <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
                </div>
                <div class="overflow-hidden flex-1">
                    <div class="text-xs font-semibold text-white truncate" sec:authentication="name">user@portal.com</div>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span sec:authorize="hasRole('ADMIN')" class="text-[10px] font-mono uppercase bg-sky-500/20 text-sky-400 px-1.5 py-0.2 rounded font-semibold">ADMIN</span>
                        <span sec:authorize="hasRole('CLIENT')" class="text-[10px] font-mono uppercase bg-emerald-500/20 text-emerald-400 px-1.5 py-0.2 rounded font-semibold">CLIENT</span>
                    </div>
                </div>
            </div>

            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit"
                        class="w-full flex items-center justify-center gap-2 py-2 px-3 bg-slate-800/80 hover:bg-rose-500/20 hover:text-rose-400 hover:border-rose-500/30 text-slate-400 text-xs font-medium rounded-lg border border-slate-700/60 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Sign Out</span>
                </button>
            </form>
        </div>
    </aside>
</body>
</html>
