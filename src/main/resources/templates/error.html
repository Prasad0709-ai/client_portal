<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Security &amp; Error Gate | ClientPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl space-y-5">
        <div class="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 mx-auto flex items-center justify-center">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        <div class="text-xs font-mono font-bold text-rose-400 uppercase tracking-widest" th:text="'HTTP ' + ${errorCode != null ? errorCode : '500'}">HTTP 403</div>
        <h1 class="text-xl font-bold text-white" th:text="${errorTitle != null ? errorTitle : 'System Notice'}">Access Prohibited</h1>
        <p class="text-xs text-slate-400 leading-relaxed" th:text="${errorMessage != null ? errorMessage : 'The requested resource cannot be loaded.'}">
            Detailed system notice explanation.
        </p>
        <div class="pt-4 border-t border-slate-800 flex justify-center gap-3">
            <a th:href="@{/}" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-medium text-xs rounded-xl shadow transition">
                Return to Workspace
            </a>
            <a th:href="@{/login}" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs rounded-xl border border-slate-700 transition">
                Re-Authenticate
            </a>
        </div>
    </div>
</body>
</html>
