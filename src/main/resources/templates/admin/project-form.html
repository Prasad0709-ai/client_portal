<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${projectDto.id == null} ? 'Create Project | ClientPortal' : 'Edit Project | ClientPortal'">Project Scope Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex min-h-screen overflow-x-hidden">

    <!-- Modular Sidebar -->
    <div th:replace="~{layout/sidebar :: sidebar(${projectDto.id == null ? 'new_project' : 'admin_dashboard'})}"></div>

    <!-- Main Form Area -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto bg-slate-950">

        <!-- Top Header Bar -->
        <header class="h-16 px-8 border-b border-slate-800 flex items-center justify-between bg-slate-900/60 backdrop-blur-md sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <a th:href="@{/admin/dashboard}" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <h1 class="text-base font-bold text-white tracking-tight"
                    th:text="${projectDto.id == null} ? 'Initialize New Project Space' : 'Update Project Scope & Metadata'">
                    Project Form
                </h1>
            </div>
        </header>

        <div class="p-8 max-w-3xl">

            <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl shadow-xl p-8">

                <form th:action="${projectDto.id == null} ? @{/admin/projects} : @{/admin/projects/{id}/edit(id=${projectDto.id})}"
                      th:object="${projectDto}" method="post" class="space-y-6">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- Project Title -->
                    <div>
                        <label for="title" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Project Title</label>
                        <input type="text" id="title" th:field="*{title}" placeholder="e.g. Omnichannel POS Cloud Modernization"
                               class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                        <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1 text-xs text-rose-400 font-medium"></p>
                    </div>

                    <!-- Client Assignment -->
                    <div>
                        <label for="clientId" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Assigned Client Account</label>
                        <select id="clientId" th:field="*{clientId}"
                                class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                            <option value="">-- Select Client Organization --</option>
                            <option th:each="cl : ${clients}" th:value="${cl.id}"
                                    th:text="${cl.company} + ' (' + ${cl.name} + ' - ' + ${cl.email} + ')'">
                                TechRetail Inc.
                            </option>
                        </select>
                        <p th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}" class="mt-1 text-xs text-rose-400 font-medium"></p>
                    </div>

                    <!-- Project Description -->
                    <div>
                        <label for="description" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Scope &amp; Technical Requirements</label>
                        <textarea id="description" th:field="*{description}" rows="4" placeholder="Detail high-level architecture objectives, deliverables, and SLAs..."
                                  class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition"></textarea>
                    </div>

                    <!-- Status & Dates Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label for="status" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Current Status</label>
                            <select id="status" th:field="*{status}"
                                    class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}">PLANNING</option>
                            </select>
                        </div>
                        <div>
                            <label for="startDate" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Start Date</label>
                            <input type="date" id="startDate" th:field="*{startDate}"
                                   class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                        </div>
                        <div>
                            <label for="endDate" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Target Completion Date</label>
                            <input type="date" id="endDate" th:field="*{endDate}"
                                   class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-800">
                        <a th:href="@{/admin/dashboard}"
                           class="px-5 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold transition">
                            Cancel
                        </a>
                        <button type="submit"
                                class="px-6 py-2.5 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-semibold text-xs rounded-xl shadow-lg shadow-sky-600/30 transition">
                            <span th:text="${projectDto.id == null} ? 'Save & Initialize Project' : 'Apply Changes'">Save Project</span>
                        </button>
                    </div>
                </form>

            </div>

        </div>
    </main>
</body>
</html>
