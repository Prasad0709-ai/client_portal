# ===================================================================
# Client Portal & Project Management (JV-CRM-005) Configuration
# ===================================================================

server.port=8080
spring.application.name=client-portal

# -------------------------------------------------------------------
# Database Configuration (MySQL 8.x Engine)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/clientportal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 6.x Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Hibernate 6 automatically resolves dialect from DataSource metadata
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Multipart File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Custom File Storage Directory
app.upload.dir=./data/uploads/

# -------------------------------------------------------------------
# Enterprise Contract Pipeline Tracking Baseline
# -------------------------------------------------------------------
app.metrics.pipeline-benchmark=45892.00
