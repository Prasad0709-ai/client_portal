# Test configuration with embedded H2
spring.datasource.url=jdbc:h2:mem:clientportal_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.upload.dir=./data/test-uploads/
app.metrics.pipeline-benchmark=45892.00
